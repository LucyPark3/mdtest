erm": "페르소나와 동일화", "q": "「페르소나와 동일화」에 대한 설명으로 옳은 것은?", "options": ["페르소나는 배우의 사생활을 그대로 공개한다는 뜻이다.", "음악의 동일화는 악보를 복제하는 것만을 뜻한다.", "동일화 전략에는 매스미디어가 필요 없다.", "페르소나는 현실의 자신과 대중의 환상 사이의 공적 정체성이다."], "answer": 3, "explanation": "영화의 동일화와 음악의 위안의 동일화를 구분한다."}, {"chapter": "19세기 예술", "term": "아티스트와 싱어송라이터", "q": "「아티스트와 싱어송라이터」에 대한 설명으로 옳은 것은?", "options": ["싱어송라이터의 핵심은 무대 의상이다.", "아티스트는 제작자의 지시만 수행하는 부속품을 뜻한다.", "아티스트는 예술적 결정권을 주장하며 싱어송라이터의 핵심은 크레딧이다.", "1950년대 록 혁명은 아티스트 등장과 무관하다."], "answer": 2, "explanation": "1950년대 LP·스테레오·록, 1960년대 싱어송라이터 개념을 연결한다."}, {"chapter": "대중음악", "term": "크루닝과 스탠더드", "q": "「크루닝과 스탠더드」에 대한 설명으로 옳은 것은?", "options": ["크루닝은 대형 극장에 맞춘 무마이크 고함 창법이다.", "스탠더드에는 틴 팬 앨리 팝이 포함되지 않는다.", "마이크로폰 발달로 부드러운 남성 보컬 크루닝이 발달했다.", "빙 크로스비는 무조음악의 대표 작곡가다."], "answer": 2, "explanation": "스탠더드의 세 뿌리: 틴 팬 앨리 팝, 쇼 튠, 스윙 빅밴드 크루너 발라드."}], [{"chapter": "19세기 예술", "term": "신 비인학파", "q": "강의자료에서 「신 비인학파」을 설명하는 내용과 일치하는 것은?", "options": ["관객에게 즉각적인 대중적 환영을 받았다.", "쇤베르크·베버른·베르크가 기존 조성의 한계를 넘고자 했다.", "드뷔시·라벨·쇼팽이 대표 3인이다.", "조성체계의 위계를 강화하는 데 주력했다."], "answer": 1, "explanation": "무조음악은 해방을 지향했으나 수용자를 해방하지 못했다는 비판을 받았다."}, {"chapter": "스타 시스템", "term": "관점의 구별", "q": "강의자료에서 「관점의 구별」을 설명하는 내용과 일치하는 것은?", "options": ["대중예술은 미학, 대중문화는 사회·역사, 문화산업은 경제 관점이다.", "대중예술은 경제, 문화산업은 미학 관점이다.", "대중문화는 오직 개인 심리만을 뜻한다.", "세 용어는 서로 무관한 현상을 뜻한다."], "answer": 0, "explanation": "하나의 현상을 서로 다른 관점에서 부르는 세 용어다."}, {"chapter": "주류예술 기원", "term": "벨 에포크", "q": "강의자료에서 「벨 에포크」을 설명하는 내용과 일치하는 것은?", "options": ["1890~1914년의 번영기이며 대중예술 인프라가 형성되었다.", "1848~1850년의 전쟁기만을 가리킨다.", "도시 노동자 모두에게 동일한 풍요가 보장되었다.", "부르주아는 문화 소비에서 완전히 배제되었다."], "answer": 0, "explanation": "산업화·부르주아의 소비 주도·대중 오락의 성장을 묶어 기억한다."}, {"chapter": "스타 시스템", "term": "페르소나와 동일화", "q": "강의자료에서 「페르소나와 동일화」을 설명하는 내용과 일치하는 것은?", "options": ["음악의 동일화는 악보를 복제하는 것만을 뜻한다.", "동일화 전략에는 매스미디어가 필요 없다.", "페르소나는 현실의 자신과 대중의 환상 사이의 공적 정체성이다.", "페르소나는 배우의 사생활을 그대로 공개한다는 뜻이다."], "answer": 2, "explanation": "영화의 동일화와 음악의 위안의 동일화를 구분한다."}, {"chapter": "주류예술 기원", "term": "보드빌", "q": "강의자료에서 「보드빌」을 설명하는 내용과 일치하는 것은?", "options": ["1880년대 버라이어티를 순화하여 중산층 관객을 겨냥했다.", "유성영화 이후 처음 등장했다.", "노래와 마술 같은 개별 공연을 금지했다.", "한 편의 일관된 서사를 중심으로 했다."], "answer": 0, "explanation": "8~10개의 독립된 act, 유성영화 전까지의 인기 공연이다."}, {"chapter": "19세기 예술", "term": "소나타 형식", "q": "강의자료에서 「소나타 형식」을 설명하는 내용과 일치하는 것은?", "options": ["재현부에서 새로운 주제만 도입한다.", "코다-재현부-제시부-전개부 순이다.", "제시부-전개부-재현부-코다로 진행한다.", "전개부에서 두 주제를 처음 제시한다."], "answer": 2, "explanation": "소나타 형식은 대립을 거친 화해와 계몽주의의 균형을 상징한다."}, {"chapter": "19세기 예술", "term": "순수예술과 자율성", "q": "강의자료에서 「순수예술과 자율성」을 설명하는 내용과 일치하는 것은?", "options": ["미를 실용성·진·선과 구별하는 관점이 확립되었다.", "미와 실용성은 반드시 동일해야 한다고 보았다.", "예술가의 개성이 부정되었다.", "왕실의 주문이 예술의 유일한 가치가 되었다."], "answer": 0, "explanation": "예술 상품화에 대한 반작용으로 자율적 예술 개념이 등장했다."}, {"chapter": "주류예술 기원", "term": "민스트럴 쇼", "q": "강의자료에서 「민스트럴 쇼」을 설명하는 내용과 일치하는 것은?", "options": ["프랑스 귀족들의 정통 오페라였다.", "흑인 배우들의 평등권 운동을 목적으로 시작했다.", "모든 공연이 완전한 즉흥 재즈로 이루어졌다.", "백인의 블랙페이스와 흑인 노예생활의 희화화가 특징인 인종차별적 쇼다."], "answer": 3, "explanation": "민스트럴 쇼는 미국적인 쇼였지만 인종차별적 성격을 지녔다."}, {"chapter": "스타 시스템", "term": "캐릭터와 퍼스낼러티", "q": "강의자료에서 「캐릭터와 퍼스낼러티」을 설명하는 내용과 일치하는 것은?", "options": ["배우의 인간미에서 캐릭터만 강조하는 방향으로 변했다.", "배역의 캐릭터 강조에서 배우의 자연스러운 인간미 강조로 변화했다.", "배우의 공적 이미지를 완전히 없앴다.", "이 변화는 무대 조명 기술만을 뜻한다."], "answer": 1, "explanation": "스타시스템은 캐릭터와 퍼스낼러티를 동일화한다."}, {"chapter": "대중음악", "term": "쇼 튠", "q": "강의자료에서 「쇼 튠」을 설명하는 내용과 일치하는 것은?", "options": ["뮤지컬 삽입곡이 작품과 별개로 독립적 히트곡이 된 경우를 포함한다.", "뮤지컬이 종연하면 삽입곡도 반드시 잊힌다.", "쇼 튠은 19세기 그랜드 오페라만을 뜻한다.", "공연의 배경음악은 절대로 쇼 튠이 될 수 없다."], "answer": 0, "explanation": "1920~1950년대 쇼 튠 중 다수가 스탠더드로 남았다."}, {"chapter": "주류예술 기원", "term": "뮤직홀과 버라이어티", "q": "강의자료에서 「뮤직홀과 버라이어티」을 설명하는 내용과 일치하는 것은?", "options": ["한 편의 드라마만을 무대에 올렸다.", "음악·춤·코미디·마술 등 다양한 공연을 결합했다.", "오페라의 레치타티보만 공연했다.", "노래와 춤을 배제한 정치 강연이었다."], "answer": 1, "explanation": "런던 뮤직홀은 레스토랑과 공연장이 결합된 공간이었다."}, {"chapter": "대중음악", "term": "틴 팬 앨리 팝", "q": "강의자료에서 「틴 팬 앨리 팝」을 설명하는 내용과 일치하는 것은?", "options": ["뉴욕 음악출판업에서 발전한 쉽고 기억하기 쉬운 발라드·댄스곡이다.", "뮤지컬과 전혀 관계가 없다.", "무조음악의 일종으로 일반 대중의 이해를 거부했다.", "즉흥 솔로만으로 구성된 재즈 장르다."], "answer": 0, "explanation": "보드빌의 인기와 음악출판업의 발전이 배경이다."}, {"chapter": "브로드웨이", "term": "오페레타와 발라드 오페라", "q": "강의자료에서 「오페레타와 발라드 오페라」을 설명하는 내용과 일치하는 것은?", "options": ["발라드 오페라는 기존 곡과 일상 대사를 사용하고, 영국식 오페레타는 대본 비중을 키웠다.", "발라드 오페라는 오직 이탈리아어 레치타티보만 사용했다.", "길버트와 설리번은 대본의 비중을 줄였다.", "오페레타는 그랜드 오페라와 완전히 동일한 장르다."], "answer": 0, "explanation": "존 게이의 거지들의 오페라, 길버트·설리번의 2막 구성을 기억한다."}, {"chapter": "대중음악", "term": "랙타임과 재즈", "q": "강의자료에서 「랙타임과 재즈」을 설명하는 내용과 일치하는 것은?", "options": ["랙타임은 초창기 재즈 리듬에 영향을 주지 않았다.", "랙타임의 본질은 무제한 즉흥연주다.", "랙타임은 싱커페이션을 사용하지만 악보대로 연주한다.", "재즈는 원칙적으로 즉흥연주를 금지한다."], "answer": 2, "explanation": "스콧 조플린을 기억하고, 재즈의 핵심은 즉흥연주다."}, {"chapter": "19세기 예술", "term": "초기 음반과 표준화", "q": "강의자료에서 「초기 음반과 표준화」을 설명하는 내용과 일치하는 것은?", "options": ["3분 SP판의 기술적 제약이 대중음악의 유형화에 영향을 주었다.", "초기 음반은 길이 제약이 전혀 없었다.", "LP는 1895년 영화보다 먼저 상용화되었다.", "표준화는 대량생산과 무관한 현상이다."], "answer": 0, "explanation": "1895년 뤼미에르 형제 영화 상영, 1902년 카루소 상업 녹음도 기억하자."}, {"chapter": "19세기 예술", "term": "그랜드 오페라", "q": "강의자료에서 「그랜드 오페라」을 설명하는 내용과 일치하는 것은?", "options": ["일관된 줄거리 없이 묘기만 나열한다.", "5막 비극적 멜로드라마와 합창·발레·화려한 무대가 특징이다.", "악기 없이 독백으로만 구성된다.", "소규모 피아노 독주를 중심으로 한다."], "answer": 1, "explanation": "19세기 파리 부르주아의 화려한 취향과 관련된다."}, {"chapter": "대중음악", "term": "크루닝과 스탠더드", "q": "강의자료에서 「크루닝과 스탠더드」을 설명하는 내용과 일치하는 것은?", "options": ["크루닝은 대형 극장에 맞춘 무마이크 고함 창법이다.", "빙 크로스비는 무조음악의 대표 작곡가다.", "마이크로폰 발달로 부드러운 남성 보컬 크루닝이 발달했다.", "스탠더드에는 틴 팬 앨리 팝이 포함되지 않는다."], "answer": 2, "explanation": "스탠더드의 세 뿌리: 틴 팬 앨리 팝, 쇼 튠, 스윙 빅밴드 크루너 발라드."}, {"chapter": "스타 시스템", "term": "스타시스템의 본질", "q": "강의자료에서 「스타시스템의 본질」을 설명하는 내용과 일치하는 것은?", "options": ["관객의 소비와는 무관하다.", "매스미디어와 독립적으로 작동한다.", "오로지 예술적 실험을 지원하는 비영리 제도다.", "문화산업의 이윤을 극대화하기 위한 장치다."], "answer": 3, "explanation": "스타는 문화예술상품이 인격화된 마케팅적 존재다."}, {"chapter": "19세기 예술", "term": "아티스트와 싱어송라이터", "q": "강의자료에서 「아티스트와 싱어송라이터」을 설명하는 내용과 일치하는 것은?", "options": ["아티스트는 예술적 결정권을 주장하며 .", "대중문화는 오직 개인 심리만을 뜻한다.", "대중예술은 미학, 대중문화는 사회·역사, 문화산업은 경제 관점이다."], "answer": 3, "explanation": "하나의 현상을 서로 다른 관점에서 부르는 세 용어다."}, {"chapter": "대중음악", "term": "크루닝과 스탠더드", "q": "「크루닝과 스탠더드」과 관련된 시험 핵심 개념으로 맞는 것은?", "options": ["스탠더드에는 틴 팬 앨리 팝이 포함되지 않는다.", "마이크로폰 발달로 부드러운 남성 보컬 크루닝이 발달했다.", "크루닝은 대형 극장에 맞춘 무마이크 고함 창법이다.", "빙 크로스비는 무조음악의 대표 작곡가다."], "answer": 1, "explanation": "스탠더드의 세 뿌리: 틴 팬 앨리 팝, 쇼 튠, 스윙 빅밴드 크루너 발라드."}, {"chapter": "19세기 예술", "term": "아티스트와 싱어송라이터", "q": "「아티스트와 싱어송라이터」과 관련된 시험 핵심 개념으로 맞는 것은?", "options": ["싱어송라이터의 핵심은 무대 의상이다.", "아티스트는 제작자의 지시만 수행하는 부속품을 뜻한다.", "아티스트는 예술적 결정권을 주장하며 싱어송라이터의 핵심은 크레딧이다.", "1950년대 록 혁명은 아티스트 등장과 무관하다."], "answer": 2, "explanation": "1950년대 LP·스테레오·록, 1960년대 싱어송라이터 개념을 연결한다."}, {"chapter": "19세기 예술", "term": "순수예술과 자율성", "q": "「순수예술과 자율성」과 관련된 시험 핵심 개념으로 맞는 것은?", "options": ["예술가의 개성이 부정되었다.", "미와 실용성은 반드시 동일해야 한다고 보았다.", "미를 실용성·진·선과 구별하는 관점이 확립되었다.", "왕실의 주문이 예술의 유일한 가치가 되었다."], "answer": 2, "explanation": "예술 상품화에 대한 반작용으로 자율적 예술 개념이 등장했다."}]];
const STORE_KEY='popart_exam_v3';
const state={set:0,answers:Array.from({length:5},()=>Array(25).fill(null)),graded:Array(5).fill(false),wrongOnly:false};
try{const saved=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(saved&&Array.isArray(saved.answers)&&saved.answers.length===5){state.answers=saved.answers.map(v=>Array.isArray(v)&&v.length===25?v.map(x=>Number.isInteger(x)&&x>=0&&x<4?x:null):Array(25).fill(null));state.graded=Array.isArray(saved.graded)&&saved.graded.length===5?saved.graded.map(Boolean):Array(5).fill(false);}}catch(e){}
const byId=id=>document.getElementById(id);const symbols=['①','②','③','④'];
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify({answers:state.answers,graded:state.graded}));}catch(e){}}
function node(tag,cl,text){const n=document.createElement(tag);if(cl)n.className=cl;if(text!==undefined)n.textContent=text;return n;}
function updateStatus(){const count=state.answers[state.set].filter(v=>v!==null).length;byId('progressText').textContent=`${state.set+1}세트 · ${count} / 25 응답`;byId('progressBar').style.width=(count*4)+'%';byId('score').textContent=state.graded[state.set] ? `정답 ${SETS[state.set].filter((q,i)=>q.answer===state.answers[state.set][i]).length} / 25`:'답안 작성 중';}
function render(){const tabs=byId('tabs');tabs.replaceChildren();for(let s=0;s<5;s++){const b=node('button','btn'+(s===state.set?' active':''),`${s+1}세트`);b.type='button';b.setAttribute('aria-current',s===state.set?'true':'false');b.addEventListener('click',()=>{state.set=s;state.wrongOnly=false;render();window.scrollTo(0,0)});tabs.append(b)}const qs=byId('questions');qs.replaceChildren();const graded=state.graded[state.set];let shown=0;SETS[state.set].forEach((q,i)=>{const selected=state.answers[state.set][i],correct=selected===q.answer;if(state.wrongOnly&&graded&&correct)return;shown++;const card=node('article','question-card');const top=node('div','qtop');top.append(node('span','num',`${i+1}번`),node('span','category',q.chapter));card.append(top,node('div','qtitle',q.q));q.options.forEach((option,j)=>{const label=node('label','option'+(graded&&j===q.answer?' correct':'')+(graded&&selected===j&&!correct?' incorrect':''));const radio=node('input');radio.type='radio';radio.name=`question-${i}`;radio.value=String(j);radio.checked=(selected===j);radio.addEventListener('change',()=>{state.answers[state.set][i]=j;state.graded[state.set]=false;state.wrongOnly=false;save();render()});label.append(radio,node('span','',symbols[j]+' '+option));card.append(label)});if(graded){const expl=node('div','explain');expl.append(node('b',correct?'good':'bad',correct?'정답입니다.':(selected===null?'미응답입니다.':'오답입니다.')));expl.append(node('div','',`정답 ${symbols[q.answer]} · ${q.explanation}`));card.append(expl)}qs.append(card)});if(shown===0)qs.append(node('div','empty','틀린 문제가 없습니다. 전체 보기로 돌아가세요.'));updateStatus();}
function grade(){state.graded[state.set]=true;state.wrongOnly=false;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function wrong(){if(!state.graded[state.set]){grade();}state.wrongOnly=true;render();}
function all(){state.wrongOnly=false;render();}
function reset(){if(confirm('현재 세트의 응답과 채점 결과를 초기화하시겠습니까?')){state.answers[state.set]=Array(25).fill(null);state.graded[state.set]=false;state.wrongOnly=false;save();render();}}
['gradeTop','gradeBottom'].forEach(id=>byId(id).addEventListener('click',grade));['wrongTop','wrongBottom'].forEach(id=>byId(id).addEventListener('click',wrong));['allTop','allBottom'].forEach(id=>byId(id).addEventListener('click',all));byId('reset').addEventListener('click',reset);render();
</script></body></html>
